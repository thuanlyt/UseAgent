[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relwit"
version = "0.1.1"
description = "Source-bound evidence and release assurance for AI-written code"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Thuan Ly" },
]
keywords = ["release-assurance", "evidence", "qa", "code-review", "ai-coding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/thuanlyt/releasewitness"
Repository = "https://github.com/thuanlyt/releasewitness"
Issues = "https://github.com/thuanlyt/releasewitness/issues"
Documentation = "https://useagent.thuanlyt.id.vn/"
Changelog = "https://github.com/thuanlyt/releasewitness/blob/main/CHANGELOG.md"
Releases = "https://github.com/thuanlyt/releasewitness/releases"

[project.scripts]
relwit = "relwit.cli:main"

[tool.setuptools]
packages = ["relwit"]
