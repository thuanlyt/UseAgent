name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m py_compile tools/useagent.py tests/test_useagent.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project protocol
        run: python tools/useagent.py validate

      - name: Validate documentation site links
        run: python docs-site/build.py --check-only

      - name: Install and smoke-test console package
        run: |
          python -m pip install --no-deps .
          useagent --help
          useagent validate
