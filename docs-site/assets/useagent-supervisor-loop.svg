<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">UseAgent supervisor loop</title>
  <desc id="desc">A user goal enters the supervisor, which writes scoped assignments for workers. Worker reports return through evidence and quality gates before the next checkpoint.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1" />
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="m0 0 10 5-10 5z" fill="#2563eb" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e293b" flood-opacity=".1" />
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#f8fafc" />
  <rect x="20" y="20" width="1160" height="520" rx="20" fill="url(#grid)" opacity=".55" />

  <path d="M183 280h92" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M487 280h126" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M887 280h122" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M1065 345c0 118-180 154-350 154s-350-36-350-154" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 10" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="48" y="228" width="135" height="104" rx="16" fill="#fff" stroke="#cbd5e1" />
    <rect x="68" y="248" width="34" height="34" rx="9" fill="#eff6ff" stroke="#bfdbfe" />
    <path d="M78 265h14M85 258v14" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    <text x="68" y="307" fill="#1e293b" font-size="17" font-weight="700">User goal</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="275" y="192" width="212" height="176" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <rect x="299" y="216" width="46" height="46" rx="12" fill="#2563eb" />
    <path d="M312 239h20M322 229v20" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <text x="299" y="296" fill="#1e293b" font-size="24" font-weight="700">Supervisor</text>
    <text x="299" y="326" fill="#52627a" font-size="16">plan · dispatch · watch</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="613" y="142" width="274" height="276" rx="18" fill="#fff" stroke="#cbd5e1" />
    <text x="641" y="181" fill="#1e293b" font-size="20" font-weight="700">Worker mailboxes</text>
    <g>
      <rect x="641" y="205" width="218" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="667" cy="229" r="9" fill="#2563eb" />
      <path d="m663 229 3 3 6-7" fill="none" stroke="#fff" stroke-width="2" />
      <text x="687" y="235" fill="#1e293b" font-size="16">scoped assignment</text>
    </g>
    <g>
      <rect x="641" y="267" width="218" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="667" cy="291" r="9" fill="#52627a" />
      <path d="M663 291h8M667 287v8" stroke="#fff" stroke-width="2" stroke-linecap="round" />
      <text x="687" y="297" fill="#1e293b" font-size="16">implementation</text>
    </g>
    <g>
      <rect x="641" y="329" width="218" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="667" cy="353" r="9" fill="#22a06b" />
      <path d="m663 353 3 3 6-7" fill="none" stroke="#fff" stroke-width="2" />
      <text x="687" y="359" fill="#1e293b" font-size="16">report + evidence</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1009" y="228" width="143" height="104" rx="16" fill="#fff" stroke="#cbd5e1" />
    <rect x="1030" y="248" width="34" height="34" rx="9" fill="#ecfdf5" stroke="#a7f3d0" />
    <path d="m1039 265 5 5 10-12" fill="none" stroke="#16845b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1030" y="307" fill="#1e293b" font-size="17" font-weight="700">QA + gate</text>
  </g>

  <g>
    <rect x="451" y="476" width="298" height="42" rx="21" fill="#1e293b" />
    <text x="600" y="503" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="600">checkpoint → next safe cycle</text>
  </g>
</svg>
