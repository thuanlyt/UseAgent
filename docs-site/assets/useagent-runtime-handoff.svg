<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">UseAgent runtime handoff</title>
  <desc id="desc">Codex, Claude Code and Antigravity use different runtime surfaces but share the same assignment, scope and report protocol.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1" /></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" fill="#2563eb" /></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e293b" flood-opacity=".1" /></filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#f8fafc" />
  <rect x="20" y="20" width="1160" height="520" rx="20" fill="url(#grid)" opacity=".55" />
  <text x="600" y="72" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="700">Different runtimes. One protocol.</text>

  <path d="M276 184h196M276 280h196M276 376h196" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M728 184h196M728 280h196M728 376h196" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="72" y="142" width="204" height="84" rx="16" fill="#fff" stroke="#cbd5e1" />
    <circle cx="108" cy="184" r="16" fill="#1e293b" /><text x="108" y="191" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">C</text>
    <text x="140" y="179" fill="#1e293b" font-size="18" font-weight="700">Codex</text><text x="140" y="202" fill="#52627a" font-size="14">native or adapter</text>
    <rect x="72" y="238" width="204" height="84" rx="16" fill="#fff" stroke="#cbd5e1" />
    <circle cx="108" cy="280" r="16" fill="#d97706" /><path d="M100 280h16M108 272v16" stroke="#fff" stroke-width="2" />
    <text x="140" y="275" fill="#1e293b" font-size="18" font-weight="700">Claude Code</text><text x="140" y="298" fill="#52627a" font-size="14">local session or adapter</text>
    <rect x="72" y="334" width="204" height="84" rx="16" fill="#fff" stroke="#cbd5e1" />
    <circle cx="108" cy="376" r="16" fill="#2563eb" /><path d="m101 376 5 5 10-12" fill="none" stroke="#fff" stroke-width="2.3" />
    <text x="140" y="371" fill="#1e293b" font-size="18" font-weight="700">Antigravity</text><text x="140" y="394" fill="#52627a" font-size="14">Project or adapter</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="472" y="130" width="256" height="292" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <rect x="504" y="160" width="192" height="58" rx="11" fill="#fff" stroke="#bfdbfe" />
    <text x="600" y="196" text-anchor="middle" fill="#2563eb" font-family="ui-monospace, monospace" font-size="17" font-weight="700">work/outbox</text>
    <rect x="504" y="236" width="192" height="58" rx="11" fill="#fff" stroke="#bfdbfe" />
    <text x="600" y="272" text-anchor="middle" fill="#2563eb" font-family="ui-monospace, monospace" font-size="17" font-weight="700">INBOX.md</text>
    <rect x="504" y="312" width="192" height="58" rx="11" fill="#1e293b" />
    <text x="600" y="348" text-anchor="middle" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="17" font-weight="700">task report</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="924" y="142" width="204" height="276" rx="16" fill="#fff" stroke="#cbd5e1" />
    <text x="952" y="184" fill="#1e293b" font-size="18" font-weight="700">Supervisor sees</text>
    <path d="M952 214h148M952 262h148M952 310h148" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="970" cy="238" r="7" fill="#2563eb" /><text x="990" y="244" fill="#52627a" font-size="15">scope</text>
    <circle cx="970" cy="286" r="7" fill="#22a06b" /><text x="990" y="292" fill="#52627a" font-size="15">report</text>
    <circle cx="970" cy="334" r="7" fill="#d97706" /><text x="990" y="340" fill="#52627a" font-size="15">next action</text>
  </g>
  <text x="600" y="490" text-anchor="middle" fill="#52627a" font-size="17">Vendor-specific launch details stay in the adapter; the mailbox contract stays portable.</text>
</svg>
