<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">UseAgent shared repository ledger</title>
  <desc id="desc">The repository is a shared source of truth containing durable instructions, a knowledge ledger, work mailboxes, reports, evidence and checkpoints.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1" /></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e293b" flood-opacity=".1" /></filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#f8fafc" />
  <rect x="20" y="20" width="1160" height="520" rx="20" fill="url(#grid)" opacity=".55" />

  <g filter="url(#shadow)">
    <rect x="70" y="96" width="1060" height="368" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="70" y="96" width="1060" height="68" rx="24" fill="#1e293b" />
    <path d="M70 140h1060" stroke="#1e293b" stroke-width="2" />
    <circle cx="108" cy="130" r="8" fill="#60a5fa" /><circle cx="136" cy="130" r="8" fill="#34d399" /><circle cx="164" cy="130" r="8" fill="#fbbf24" />
    <text x="206" y="138" fill="#fff" font-family="ui-monospace, monospace" font-size="20" font-weight="700">project-root / shared source of truth</text>

    <g>
      <rect x="106" y="206" width="276" height="194" rx="16" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="134" y="244" fill="#2563eb" font-family="ui-monospace, monospace" font-size="15" font-weight="700">/knowledge</text>
      <text x="134" y="276" fill="#1e293b" font-size="20" font-weight="700">Context ledger</text>
      <text x="134" y="311" fill="#52627a" font-size="16">maps · contracts</text>
      <text x="134" y="337" fill="#52627a" font-size="16">module cards · decisions</text>
      <path d="M134 365h118" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" />
    </g>

    <g>
      <rect x="412" y="206" width="276" height="194" rx="16" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="440" y="244" fill="#2563eb" font-family="ui-monospace, monospace" font-size="15" font-weight="700">/work</text>
      <text x="440" y="276" fill="#1e293b" font-size="20" font-weight="700">Work ledger</text>
      <text x="440" y="311" fill="#52627a" font-size="16">registry · inboxes</text>
      <text x="440" y="337" fill="#52627a" font-size="16">reports · completed log</text>
      <path d="M440 365h118" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    </g>

    <g>
      <rect x="718" y="206" width="376" height="194" rx="16" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="746" y="244" fill="#16845b" font-family="ui-monospace, monospace" font-size="15" font-weight="700">/evidence + /checkpoints</text>
      <text x="746" y="276" fill="#1e293b" font-size="20" font-weight="700">Proof and memory</text>
      <text x="746" y="311" fill="#52627a" font-size="16">commands · QA output</text>
      <text x="746" y="337" fill="#52627a" font-size="16">resume point · next action</text>
      <path d="M746 365h172" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <g fill="#2563eb">
    <circle cx="398" cy="303" r="7" /><circle cx="704" cy="303" r="7" />
  </g>
  <path d="M382 303h22M688 303h22" stroke="#2563eb" stroke-width="3" />
  <text x="600" y="505" text-anchor="middle" fill="#52627a" font-size="17">Agents read a compact ledger first, then leave durable handover evidence.</text>
</svg>
